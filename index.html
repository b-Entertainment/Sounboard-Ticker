<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
body {
    margin: 0;
    overflow: hidden;
    background: transparent;
}

.ticker-wrap {
    position: fixed;
    bottom: 0;
    width: 100%;
    height: 60px;
    overflow: hidden;
}

.ticker{
    white-space:nowrap;
    font-size:64px;
    font-family:Arial,sans-serif;
    color:white;
    text-shadow:
        -2px -2px 0 #000,
         2px -2px 0 #000,
        -2px  2px 0 #000,
         2px  2px 0 #000;
    animation:ticker 120s linear infinite;
}

@keyframes scroll {
    from {
        transform: translateX(100vw);
    }
    to {
        transform: translateX(-100%);
    }
}
</style>
</head>
<body>

<div class="ticker-wrap">
    <div class="ticker">
        🎵 SOUND COMMANDS:
        !boaby • !bruh • !chaching • !clap • !dchill • !deeptrouble • !dontbs • !fart • !hellothere • !nailed • !naughty • !parkour • !pugwash • !run • !sailor • !savage • !shesaid • !Shitonit • !stopbeing • !succeed • !swear • !verynice • !whatthehell • !whodad • !whyhere • !wtf •
    </div>
</div>

</body>
</html>
