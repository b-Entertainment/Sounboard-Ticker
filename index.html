<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
body {
    margin: 0;
    overflow: hidden;
    background: transparent;
}

.ticker-wrap {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100vw;
    height: 100px;
    overflow: hidden;
}

.ticker {
    display: inline-block;
    white-space: nowrap;
    font-size: 70px;
    font-family: Arial, sans-serif;
    color:white;
    font-weight: bold;
    animation: scroll 150s linear infinite;
}

@keyframes scroll {
    from {
        transform: translateX(100vw);
    }
    to {
        transform: translateX(-100%);
    }
}
</style>
</head>
<body>

<div class="ticker-wrap">
    <div class="ticker">
        🎵 SOUND COMMANDS:
        !boaby • !bruh • !chaching • !clap • !dchill • !deeptrouble • !dontbs • !fart • !hellothere • !nailed • !naughty • !parkour • !pugwash • !run • !sailor • !savage • !shesaid • !Shitonit • !stopbeing • !succeed • !swear • !verynice • !whatthehell • !whodad • !whyhere • !wtf •
    </div>
</div>

</body>
</html>
